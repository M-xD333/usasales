name: Offline review validation
on:
  workflow_dispatch:
    inputs:
      audit:
        description: Read-only audit to run after tests
        type: choice
        options: [none, weight, feeds]
        default: none
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DRY_RUN: '1'
      TZ: Asia/Tashkent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q -x '/\.git/' .
      - run: python -m pytest -q
      - name: Read-only weight probe
        if: inputs.audit == 'weight'
        run: python tools/weight_runner_probe.py
      - uses: actions/upload-artifact@v4
        if: inputs.audit == 'weight' && always()
        with:
          name: weight-runner-probe-${{ github.run_id }}
          path: /tmp/weight-runner-probe.json
          retention-days: 7
      - name: Read-only feeds probe
        if: inputs.audit == 'feeds'
        run: python tools/feed_probe.py
      - uses: actions/upload-artifact@v4
        if: inputs.audit == 'feeds' && always()
        with:
          name: feed-probe-${{ github.run_id }}
          path: /tmp/feed-probe.json
          retention-days: 7
