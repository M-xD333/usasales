name: deals-bot

on:
  schedule:
    # Watchdog: tsikl uzilsa qayta ko'taradi. GitHub minimumi — 5 daqiqa.
    # Asosiy ish ichki tsiklda, shuning uchun bu faqat o't oldirgich.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = обычный запуск, smoke = проверить все источники (без публикации)"
        type: choice
        options: [run, smoke]
        default: run
      dry_run:
        description: "Тестовый запуск без отправки сообщений и без сохранения состояния"
        type: boolean
        default: true
      loop:
        description: "Непрерывный цикл (выключить = один проход)"
        type: boolean
        default: true

concurrency:
  # Bir vaqtda faqat bitta tsikl. Navbatdagi cron tiklari avtomatik bekor qilinadi.
  group: deals-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub hosted runner limiti — 6 soat (360 daq). Tsikl 330 daq, qolgani push uchun.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Run bot (continuous loop)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Необязательные настройки: Settings -> Secrets and variables -> Actions -> Variables
          ENABLE_SOURCES: ${{ vars.ENABLE_SOURCES }}
          DISABLE_SOURCES: ${{ vars.DISABLE_SOURCES }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MAX_DEAL_AGE_HOURS: ${{ vars.MAX_DEAL_AGE_HOURS }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          # по расписанию всегда публикуем; ручной запуск по умолчанию тестовый
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          SMOKE_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke') && '--smoke' || '' }}
          LOOP: ${{ (github.event_name == 'workflow_dispatch' && !inputs.loop) && '0' || '1' }}
          # Tsikl oynasi va iteratsiyalar orasidagi pauza (Variables bilan o'zgartiriladi)
          LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '330' }}
          LOOP_INTERVAL_SECONDS: ${{ vars.LOOP_INTERVAL_SECONDS || '120' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          persist=1
          if [ "$DRY_RUN" = "1" ] || [ -n "$SMOKE_FLAG" ]; then persist=0; fi
          # smoke — bir martalik tekshiruv, aylantirmaymiz
          if [ -n "$SMOKE_FLAG" ]; then LOOP=0; fi

          if [ "$persist" = "1" ]; then
            git config user.name "deals-bot"
            git config user.email "deals-bot@users.noreply.github.com"
          fi

          push_state() {
            [ "$persist" = "1" ] || return 0
            python workflow_git.py push
          }

          sync_code() {
            [ "$persist" = "1" ] || return 0
            python workflow_git.py sync
          }

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          i=0
          while : ; do
            i=$(( i + 1 ))
            echo "::group::iteration $i — $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            python bot.py $SMOKE_FLAG || echo "::warning::bot exit=$? — tsikl davom etadi"
            echo "::endgroup::"

            push_state

            [ "$LOOP" = "1" ] || break

            if [ $(( $(date +%s) + LOOP_INTERVAL_SECONDS )) -ge "$deadline" ]; then
              echo "Tsikl oynasi tugadi ($i iteratsiya). Keyingi run cron/self-dispatch bilan ko'tariladi."
              break
            fi
            sleep "$LOOP_INTERVAL_SECONDS"
            sync_code
          done

      - name: Save state (safety net)
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'smoke' || inputs.dry_run))
        run: python workflow_git.py push

      - name: Preserve state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: deals-state-${{ github.run_id }}
          path: data/
          retention-days: 7
          if-no-files-found: ignore

      # Tsiklni cron'ga bog'lab qo'ymaslik uchun: o'zini qayta ishga tushiradi.
      # DISPATCH_PAT bo'lmasa — jim o'tkazib yuboradi va cron watchdog ishlaydi.
      - name: Chain next run
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.loop && inputs.mode == 'run'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DISPATCH_PAT yo'q — zanjir cron watchdog'ga tayanadi."
            exit 0
          fi
          gh workflow run deals.yml --ref "$REF" \
            -f mode=run -f dry_run=false -f loop=true \
            && echo "Keyingi run navbatga qo'yildi."
